[project]
name = "creditpulse-iq"
version = "0.0.1"
description = "CreditPulse IQ — corporate credit-distress agent, backtested against real bankruptcy and AAER outcomes."
requires-python = ">=3.10"
dependencies = [
    # Serving
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "httpx",
    # Orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # The ranker, and the arithmetic under it
    "lightgbm>=4",
    "scikit-learn>=1.3",
    "numpy",
    "pandas",
    # Model client (any OpenAI-compatible endpoint) and document parsing
    "openai>=1.30",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Optional at runtime. Tracing is a no-op without keys; a local model is only
# needed if you self-host one instead of calling an endpoint.
tracing = ["langfuse>=3"]
local-model = ["torch", "transformers"]

[tool.pytest.ini_options]
testpaths = ["evals"]
addopts = "-m 'not network'"
markers = [
    "network: hits SEC EDGAR live; deselected by default",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
