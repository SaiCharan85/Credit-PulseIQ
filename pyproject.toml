[project]
name = "creditpulse-iq"
version = "0.0.1"
description = "CreditPulse IQ — corporate credit-distress agent, backtested against real bankruptcy and AAER outcomes."
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Upper bounds are the versions tested. A clean install picked up pypdf 7,
    # openai 3 and LightGBM 4.7, which cannot load the shipped ranker -- CI broke
    # while every local run passed. Raise a bound only after the suite passes on it.
    # Serving
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.27",
    "python-multipart",  # FastAPI needs it for the /api/upload form endpoint
    "pydantic>=2,<2.13",
    "httpx",
    # Orchestration
    "langgraph>=0.2,<1.1",
    "langchain-core>=0.3,<1.2",
    "langgraph-checkpoint<4",  # 4.x passes kwargs langchain-core 1.1 rejects
    # The ranker, and the arithmetic under it
    "lightgbm>=4,<4.7",
    "scikit-learn>=1.3",
    "numpy",
    "pandas",
    # Model client (any OpenAI-compatible endpoint) and document parsing
    "openai>=1.30,<2",
    "pypdf>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Optional at runtime. Tracing is a no-op without keys; a local model is only
# needed if you self-host one instead of calling an endpoint.
tracing = ["langfuse>=3,<5"]
# Retrieval over filing text (rag/). Embeds locally through ONNX -- no torch.
rag = ["qdrant-client>=1.14,<1.15", "fastembed>=0.9", "tokenizers<0.21", "psutil"]
local-model = ["torch", "transformers"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Name the packages. With a flat layout and no list, setuptools finds results/
# and web/ as well and refuses to build -- which failed `pip install -e .` in CI.
[tool.setuptools.packages.find]
include = ["agents*", "compute*", "data*", "evals*", "models*", "rag*", "verify*"]

[tool.pytest.ini_options]
testpaths = ["evals"]
addopts = "-m 'not network'"
markers = [
    "network: hits SEC EDGAR live; deselected by default",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
