<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreditPulse IQ — analyst terminal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'};</script>
<style>
  html,body,#root{height:100%}
  body{background:#020617;overscroll-behavior:none}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#1e293b;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}
  .tnum{font-variant-numeric:tabular-nums lining-nums}
  /* Absence is a state, not a blank. Hatched so it reads as deliberate. */
  .hatch{background:repeating-linear-gradient(135deg,transparent,transparent 4px,
         rgba(100,116,139,.14) 4px,rgba(100,116,139,.14) 5px)}
  /* A term a non-specialist may not know. Dotted, so it invites a hover
     without shouting like a link. */
  .term{border-bottom:1px dotted #475569;cursor:help}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3/dist/htm.umd.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
/* CreditPulse IQ — analyst terminal.
 *
 * Seven views over one spine. The left rail (search, as-of date, severity
 * ladder) persists across all of them, because the question "which company, at
 * which date" is common to every screen and re-asking it per tab is how a
 * reader loses their place.
 *
 * Written to be read by someone who is not a credit analyst. Every ratio
 * carries a plain-English gloss on hover, every verdict is restated as a
 * sentence, and no screen assumes the reader knows what a covenant is.
 *
 * Conventions held throughout, each because the alternative misleads:
 *   - Colour lands on a numeral or a rule, never as a card fill. A saturated
 *     panel shouts before the reader has seen the figure that caused it.
 *   - Every number carries the period it came from. There is no "current".
 *   - A missing figure gets a hatched container, not a blank cell: companies
 *     in trouble stop reporting things, so absence is itself a reading.
 *   - Clicking a cited figure highlights its proof in place. No modal, no
 *     scroll jump, no losing position in a column of balances.
 */
const { useState, useEffect, useRef, useCallback } = React;
const html = htm.bind(React.createElement);
const api = (p) => fetch(p).then(r => r.json());
const post = (p, b) => fetch(p, {method:'POST', headers:{'Content-Type':'application/json'},
                                 body: JSON.stringify(b)}).then(r => r.json());

const VIEWS = [
  ['overview',  'Start here',  'home'],
  ['memo',      'Report',      'file-text'],
  ['diagnostic','Health check','stethoscope'],
  ['portfolio', 'Compare',     'layers'],
  ['document',  'Read a filing','file-search'],
  ['ask',       'Ask',         'message-square'],
  ['method',    'How we know', 'flask-conical'],
];
const VIEW_SUB = {
  overview:'What this is', memo:'The full write-up, with sources',
  diagnostic:'One company, health at a glance', portfolio:'Several companies side by side',
  document:'Scan a document you have', ask:'Questions, answered only from evidence',
  method:'What we measured, and what we did not',
};

/* Plain-English glosses. Anything a reader outside finance would have to look
   up gets one; the term itself stays, so the vocabulary is still learnable. */
const GLOSS = {
  current_ratio:'Short-term things the company owns, divided by what it owes within a year. Below 1 means bills due sooner than cash arrives.',
  quick_ratio:'Like the current ratio, but ignoring inventory — stock that may not sell quickly.',
  liabilities_to_assets:'How much of everything the company owns is funded by debt and other obligations. Above 0.7 is heavy.',
  debt_to_assets:'Borrowed money as a share of everything owned.',
  interest_coverage:'How many times over the company’s profits cover its interest bill. Below 1.5 is tight; below 1 means profits do not cover interest.',
  ocf_to_debt:'Cash actually generated by the business, against total debt. Shows whether debt can be repaid from operations.',
  net_margin:'Profit left from each dollar of sales. Negative means the company loses money on what it sells.',
  altman_z_double_prime:'A long-standing distress score combining five balance-sheet measures. Lower means more strain.',
  total_assets:'Everything the company owns.',
  total_liabilities:'Everything the company owes.',
  current_assets:'Cash and things expected to turn into cash within a year.',
  current_liabilities:'Bills and debts due within a year.',
  revenue:'Total sales.',
  net_income:'Profit after every cost, including tax.',
  cash_from_operations:'Cash the core business actually produced, before investing or borrowing.',
  working_capital:'Short-term assets minus short-term bills — the buffer for day-to-day operations.',
  retained_earnings:'Profits kept in the business over its lifetime rather than paid out.',
  going_concern:'A formal warning, written by the company’s own auditor, that it may not survive the next year.',
  auc:'A score from 0.5 to 1.0 for how well a method ranks risky companies above safe ones. 0.5 is a coin flip; 1.0 is perfect.',
};
const gl = k => GLOSS[k] || GLOSS[String(k).toLowerCase().replace(/\s+/g,'_')] || '';
const Term = ({ k, children }) => {
  const t = gl(k);
  return t ? html`<span class="term" title=${t}>${children}</span>` : html`<span>${children}</span>`;
};
const pretty = k => String(k).replace(/_/g,' ').replace(/\bocf\b/,'operating cash flow');

/* Measured facts. Kept honest: the distress work TIES a tuned baseline. */
const LEGS = {
  distress: { status:'BACKTESTED',   tone:'emerald', plain:'Tested against real bankruptcies',
              detail:'0.963 AUC — ties a 0.977 statistical baseline' },
  earnings: { status:'DEMO-GRADE',   tone:'amber',   plain:'Not reliable enough to count',
              detail:'0.51–0.61 AUC; excluded from the graded signal' },
  context:  { status:'CONTEXT-ONLY', tone:'slate',   plain:'Background only — does not affect the verdict',
              detail:'narrative; never moves the graded signal' },
};
const TIERS = [
  { key:'default',       label:'DEFAULT',       plain:'Already filed for bankruptcy', tone:'text-red-400',    rule:'border-red-500'    },
  { key:'near_default',  label:'NEAR DEFAULT',  plain:'On the edge',                  tone:'text-orange-400', rule:'border-orange-500' },
  { key:'stress',        label:'STRESS',        plain:'Clear strain',                 tone:'text-amber-400',  rule:'border-amber-500'  },
  { key:'early_warning', label:'EARLY WARNING', plain:'Something worth watching',     tone:'text-slate-400',  rule:'border-slate-600'  },
];
const SIGNAL_TONE = {
  severe_risk:'text-red-400', elevated_risk:'text-orange-400',
  watch:'text-amber-400', healthy:'text-emerald-400', insufficient_evidence:'text-slate-400',
};
const SIGNAL_PLAIN = {
  severe_risk:'The filings show serious financial strain across several measures at once.',
  elevated_risk:'Several warning signs are present in the filings.',
  watch:'Mostly sound, with one or two things worth keeping an eye on.',
  healthy:'Nothing in the filings breaches the usual warning levels.',
  insufficient_evidence:'Not enough was filed to form a view. That is a finding, not a pass.',
};
const ZONE_TONE = { severe:'text-red-400', elevated:'text-orange-400', monitored:'text-amber-400',
                    stable:'text-emerald-400', insufficient:'text-slate-400' };
const ZONE_HEX = { severe:'#f87171', elevated:'#fb923c', monitored:'#fbbf24',
                   stable:'#34d399', insufficient:'#64748b' };
const ZONE_ORDER = ['stable','monitored','elevated','severe'];

const money = v => {
  if (v == null) return null;
  const a = Math.abs(v);
  if (a >= 1e9) return (v/1e9).toFixed(2)+'bn';
  if (a >= 1e6) return (v/1e6).toFixed(1)+'m';
  if (a >= 1e3) return (v/1e3).toFixed(0)+'k';
  return v.toFixed(0);
};
const num = v => v == null ? null
  : (Math.abs(v) >= 1000 ? (+v).toExponential(2) : (+v).toFixed(4).replace(/\.?0+$/,''));

/* The conversation, kept until the reader deletes it.
 *
 * An analyst who reloads the page has not finished thinking, and the threads
 * are already scoped per company and per as-of date, so restoring them is safe
 * in exactly the way carrying them across a company switch is not.
 *
 * Nothing expires on a timer. A thread that vanished on its own would be worse
 * than one that was never kept: the reader would be mid-sentence with a
 * conversation that had quietly reset underneath them.
 */
const CHAT_KEY = 'creditpulse.chat.v1';

/* Capped so one long session cannot fill the origin's storage quota and start
   throwing on every write. Newest kept -- the tail is what a follow-up needs. */
const CHAT_MAX_TURNS = 200;

function loadChat() {
  try {
    const raw = localStorage.getItem(CHAT_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];   // corrupt or unavailable storage costs the history, not the app
  }
}

function saveChat(log) {
  try {
    localStorage.setItem(CHAT_KEY, JSON.stringify((log || []).slice(0, CHAT_MAX_TURNS)));
  } catch (e) {
    /* Private browsing, a full quota, or storage disabled. The chat keeps
       working in memory; only reload-survival is lost. */
  }
}

function Icon({ name, cls='w-4 h-4' }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);
      ref.current.appendChild(el);
      window.lucide.createIcons({ nameAttr:'data-lucide' });
      const svg = ref.current.querySelector('svg');
      if (svg) svg.setAttribute('class', cls);
    }
  }, [name, cls]);
  return html`<span ref=${ref} class="inline-flex items-center"/>`;
}

/* A figure that could not be computed. Given a container rather than hidden:
   an untagged item is a finding, and blanking it would let a reader assume it
   was checked and found clean. */
function Absent({ what='not reported' }) {
  return html`<span class="hatch inline-flex items-center gap-1.5 rounded border border-slate-700
    px-2 py-0.5 font-mono text-[11px] text-slate-500"
    title="The company did not report this in machine-readable form. We show the gap rather than hide it.">
    <${Icon} name="minus" cls="w-3 h-3"/>${what}</span>`;
}

function Badge({ status, tone, title }) {
  const tones = { emerald:'text-emerald-400 border-emerald-500/60',
                  amber:'text-amber-400 border-amber-500/60',
                  sky:'text-sky-400 border-sky-500/60',
                  slate:'text-slate-400 border-slate-600' };
  return html`<span title=${title||''} class=${`inline-block border-l-2 pl-2 font-mono
    text-[10px] tracking-wider ${tones[tone]||tones.slate}`}>${status}</span>`;
}
function Card({ title, right, children, note }) {
  return html`<div class="mb-4 rounded border border-slate-800 bg-slate-900/40">
    ${title && html`<div class="flex items-center justify-between gap-3 border-b border-slate-800 px-4 py-2.5">
      <h3 class="text-[11.5px] font-semibold uppercase tracking-wider text-slate-300">${title}</h3>
      ${right}</div>`}
    <div class="px-4 py-3.5">${children}
      ${note && html`<p class="mt-2.5 text-[10.5px] leading-relaxed text-slate-600">${note}</p>`}</div>
  </div>`;
}
const Th = ({ children, r }) => html`<th class=${`py-1.5 text-[9.5px] font-semibold uppercase
  tracking-wider text-slate-500 ${r?'text-right':'text-left'}`}>${children}</th>`;

/* Single series. No legend — the title names it. Thin stroke, recessive axis,
   endpoints labelled rather than a number on every point. */
function Spark({ points, w=330, h=90 }) {
  const pts = (points||[]).filter(p => p.value != null);
  if (pts.length < 2) return html`<${Absent} what="too few periods to plot"/>`;
  const vs = pts.map(p => p.value);
  const lo = Math.min(...vs), hi = Math.max(...vs), span = (hi-lo) || 1;
  const x = i => 8 + i*(w-56)/(pts.length-1);
  const y = v => h-20 - ((v-lo)/span)*(h-34);
  const d = pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const last = pts[pts.length-1];
  return html`<svg viewBox=${`0 0 ${w} ${h}`} class="w-full" style=${{maxWidth:w+'px'}}>
    <line x1="8" y1=${h-20} x2=${w-48} y2=${h-20} stroke="#1e293b" stroke-width="1"/>
    <path d=${d} fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>html`<circle key=${i} cx=${x(i)} cy=${y(p.value)} r="3" fill="#38bdf8"
      stroke="#020617" stroke-width="2"><title>${p.period_end}: ${p.value.toFixed(3)}</title></circle>`)}
    <text x=${w-42} y=${y(last.value)+4} fill="#e2e8f0" font-size="11"
      font-family="ui-monospace,monospace">${last.value.toFixed(2)}</text>
    <text x="8" y=${h-6} fill="#475569" font-size="9.5" font-family="ui-monospace,monospace">${pts[0].period_end}</text>
    <text x=${w-48} y=${h-6} fill="#475569" font-size="9.5" text-anchor="end"
      font-family="ui-monospace,monospace">${last.period_end}</text>
  </svg>`;
}

/* Render the answer's own structure: headings, bullets, nested bullets and
   tables. The model is now told to choose a shape per section -- prose for a
   causal chain, bullets for parallel items, a table for several items compared
   on the same columns -- and that choice is wasted if the surface flattens it
   back into one grey block, which `whitespace-pre-line` did.

   Deliberately small. This is not a markdown implementation; it is the four
   shapes the prompt can produce, and anything unrecognised falls through as a
   paragraph rather than being dropped. */
function Rich({ text }) {
  const lines = String(text || '').split('\n');
  const blocks = [];
  let list = null, table = null, para = [];
  const flushPara = () => { if (para.length) { blocks.push({t:'p', v:para.join(' ')}); para=[]; } };
  const flushList = () => { if (list) { blocks.push({t:'ul', v:list}); list=null; } };
  const flushTable = () => { if (table) { blocks.push({t:'table', v:table}); table=null; } };
  const flushAll = () => { flushPara(); flushList(); flushTable(); };

  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    const t = line.trim();
    if (!t) { flushAll(); continue; }

    const head = t.match(/^(#{2,4})\s+(.*)$/);
    if (head) { flushAll(); blocks.push({t:'h', v:head[2], depth:head[1].length}); continue; }

    // A markdown table row. The separator row is structure, not content.
    if (/^\|.*\|$/.test(t)) {
      flushPara(); flushList();
      const cells = t.slice(1, -1).split('|').map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
      (table = table || []).push(cells);
      continue;
    }
    flushTable();

    const bullet = line.match(/^(\s*)(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (bullet) {
      flushPara();
      (list = list || []).push({ depth: Math.min(2, Math.floor(bullet[1].length / 2)), v: bullet[2] });
      continue;
    }
    // An indented continuation belongs to the bullet above it, not to a new
    // paragraph -- otherwise a wrapped bullet becomes an orphan line.
    if (list && /^\s{2,}/.test(line)) { list[list.length - 1].v += ' ' + t; continue; }
    flushList();
    para.push(t);
  }
  flushAll();

  return html`<div class="space-y-2">
    ${blocks.map((b, i) => {
      if (b.t === 'h') return html`<h4 key=${i} class=${`mt-3 first:mt-0 font-semibold text-slate-100 ${
        b.depth <= 2 ? 'text-[12.5px]' : 'text-[11.5px] text-slate-300'}`}>${b.v}</h4>`;
      if (b.t === 'ul') return html`<ul key=${i} class="space-y-1">
        ${b.v.map((li, j) => html`<li key=${j} class=${`flex gap-2 text-[12.5px] leading-relaxed text-slate-300 ${
          li.depth ? 'ml-4' : ''}`}>
          <span class=${`mt-[7px] h-1 w-1 shrink-0 rounded-full ${
            li.depth ? 'bg-slate-700' : 'bg-slate-500'}`}></span>
          <span>${li.v}</span></li>`)}</ul>`;
      if (b.t === 'table') {
        const [head, ...rows] = b.v;
        return html`<div key=${i} class="overflow-x-auto"><table class="w-full text-[12px]">
          <tr class="border-b border-slate-800">
            ${head.map((h, j) => html`<th key=${j} class=${`py-1.5 text-[9.5px] font-semibold uppercase tracking-wider text-slate-500 ${
              j ? 'text-right' : 'text-left'}`}>${h}</th>`)}</tr>
          ${rows.map((r, j) => html`<tr key=${j} class="border-b border-slate-900">
            ${r.map((c, k) => html`<td key=${k} class=${`py-1.5 ${
              k ? 'text-right font-mono tabular-nums text-slate-100' : 'text-slate-300'}`}>${c}</td>`)}</tr>`)}
        </table></div>`;
      }
      return html`<p key=${i} class="text-[12.5px] leading-relaxed text-slate-300">${b.v}</p>`;
    })}
  </div>`;
}

/* ----------------------------------------------------------- LEFT RAIL ---- */
function Rail({ asOf, setAsOf, onPick, active, view, setView }) {
  const [q, setQ] = useState('Diebold');
  const [cands, setCands] = useState([]);
  const [feed, setFeed] = useState(null);
  const [tier, setTier] = useState('');

  useEffect(() => {
    api(`/api/ladder?as_of=${asOf}&limit=80${tier?`&tier=${tier}`:''}`).then(setFeed);
  }, [asOf, tier]);

  const search = async () => {
    const v = q.trim(); if (!v) return;
    if (/^\d+$/.test(v)) { setCands([]); onPick({ cik:+v }); return; }
    const d = await api(`/api/search?q=${encodeURIComponent(v)}`);
    if (d.resolved) { setCands([]); onPick(d.resolved); }
    else setCands(d.candidates || []);
  };

  return html`<aside class="flex h-full w-[292px] shrink-0 flex-col border-r border-slate-800 bg-slate-950">
    <div class="border-b border-slate-800 px-4 py-3">
      <div class="flex items-center gap-2 text-slate-100">
        <${Icon} name="activity" cls="w-4 h-4 text-emerald-400"/>
        <span class="text-[13px] font-semibold tracking-tight">CreditPulse IQ</span>
      </div>
      <p class="mt-0.5 text-[10px] text-slate-500">Reading company filings for signs of trouble</p>
    </div>

    <nav class="grid grid-cols-2 gap-1 border-b border-slate-800 px-3 py-2.5">
      ${VIEWS.map(([k,l,ic])=>html`<button key=${k} onClick=${()=>setView(k)} title=${VIEW_SUB[k]}
        class=${`flex items-center gap-1.5 rounded px-2 py-1.5 text-left text-[11px] ${
          view===k?'bg-slate-800 text-slate-100':'text-slate-500 hover:bg-slate-900 hover:text-slate-300'}`}>
        <${Icon} name=${ic} cls="w-3.5 h-3.5"/>${l}</button>`)}
    </nav>

    <div class="space-y-2.5 border-b border-slate-800 px-4 py-3">
      <div>
        <label class="mb-1 block text-[9.5px] font-semibold uppercase tracking-wider text-slate-500">
          Find a company</label>
        <div class="flex gap-1.5">
          <input value=${q} onInput=${e=>setQ(e.target.value)} placeholder="name, ticker or CIK"
            onKeyDown=${e=>e.key==='Enter'&&search()}
            class="w-full rounded border border-slate-700 bg-slate-900 px-2.5 py-1.5 font-mono
                   text-[12px] text-slate-100 outline-none placeholder:text-slate-600 focus:border-sky-600"/>
          <button onClick=${search} class="rounded border border-slate-700 px-2 text-slate-400
                   hover:border-slate-500 hover:text-slate-100"><${Icon} name="search" cls="w-3.5 h-3.5"/></button>
        </div>
        <p class="mt-1 text-[10px] leading-snug text-slate-600">
          Type a name — we match it to the company's SEC ID number. Tickers get reused
          after a company disappears, so the ID is what we track.</p>
      </div>
      ${cands.length>0 && html`<div class="rounded border border-slate-700 bg-slate-900">
        <div class="border-b border-slate-800 px-2 py-1 text-[9.5px] uppercase tracking-wider text-slate-500">
          ${cands.length} matches — pick one</div>
        ${cands.slice(0,6).map(c=>html`<button key=${c.cik} onClick=${()=>{setCands([]);onPick(c);}}
          class="block w-full px-2 py-1.5 text-left hover:bg-slate-800">
          <div class="truncate text-[11.5px] text-slate-200">${c.name}</div>
          <div class="font-mono text-[10px] text-slate-500">${c.ticker||'—'} · CIK ${c.cik}</div>
        </button>`)}
      </div>`}
      <div>
        <label class="mb-1 block text-[9.5px] font-semibold uppercase tracking-wider text-slate-500">
          Pretend it is this date</label>
        <input type="date" value=${asOf} onInput=${e=>setAsOf(e.target.value)}
          class="w-full rounded border border-slate-700 bg-slate-900 px-2.5 py-1.5 font-mono
                 text-[12px] text-slate-100 outline-none focus:border-sky-600"/>
        <p class="mt-1 text-[10px] leading-snug text-slate-600">
          Anything filed after this date is hidden — from the system and from you. That is
          how we check the system could have spotted trouble at the time.</p>
      </div>
    </div>

    <div class="flex items-center justify-between border-b border-slate-800 px-4 py-2">
      <span class="text-[9.5px] font-semibold uppercase tracking-wider text-slate-500">Companies in trouble</span>
      ${feed && html`<span class="font-mono text-[10px] text-slate-600 tnum">${feed.total_visible}</span>`}
    </div>
    <div class="flex gap-1 border-b border-slate-800 px-3 py-2">
      ${[{key:'',label:'ALL',plain:'Everything'},...TIERS].map(t=>html`<button key=${t.key}
        onClick=${()=>setTier(t.key)} title=${t.plain}
        class=${`rounded px-1.5 py-0.5 font-mono text-[9px] tracking-wide ${
          tier===t.key?'bg-slate-800 text-slate-100':'text-slate-500 hover:text-slate-300'}`}>
        ${t.label.split(' ')[0]}${feed&&t.key?html` <span class="tnum">${feed.counts[t.key]}</span>`:''}</button>`)}
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto">
      ${!feed && html`<p class="px-4 py-3 text-[11px] text-slate-600">Loading…</p>`}
      ${feed && feed.rows.length===0 && html`<p class="px-4 py-3 text-[11px] text-slate-600">
        Nothing had happened yet at this date.</p>`}
      ${feed && feed.rows.map((r,i)=>{
        const t = TIERS.find(x=>x.key===r.tier) || TIERS[3];
        const on = active && active.cik===r.cik;
        const named = !!r.name;
        return html`<button key=${i} onClick=${()=>onPick({cik:r.cik,name:r.name})}
          title=${`${r.name||'CIK '+r.cik} — ${t.plain}, ${r.signal?.replace(/_/g,' ')||'event'} on ${r.event_date||r.as_of_date}`}
          aria-current=${on?'true':'false'}
          class=${`relative block w-full border-l-2 py-2 pl-3.5 pr-3 text-left ${t.rule} ${
            on?'bg-sky-950/40 ring-1 ring-inset ring-sky-700':'hover:bg-slate-900'}`}>
          ${on && html`<span class="absolute right-2 top-2 font-mono text-[9px] tracking-wider text-sky-400">OPEN</span>`}
          <div class="flex items-baseline justify-between gap-2 pr-8">
            <span class=${`truncate text-[11.5px] ${on?'text-slate-50':'text-slate-200'}`}>
              ${r.name || 'Unnamed filer'}</span>

  check_going_concern:'Reading the auditor’s wording for survival doubts',
  get_filing_events:'Checking for late filings, covenant breaches and delisting notices',
  get_hazard_baseline:'Reading the statistical baseline for reference',

};

function Progress({ steps, elapsed }) {
  return html`<div class="mx-auto max-w-xl px-8 py-10">
    <div class="mb-4 flex items-baseline justify-between">
      <span class="text-[12.5px] font-semibold text-slate-200">Investigating…</span>

    <p class="mb-4 text-[11.5px] leading-relaxed text-slate-500">

      A full investigation takes a couple of minutes; here is what it is doing.</p>
    ${steps.length===0 && html`<div class="flex items-center gap-2 text-[11.5px] text-slate-500">
      <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-sky-400"></span>
      Loading the company’s filings…</div>`}
    ${steps.map((s,i)=>{
      const live = i===steps.length-1;
      return html`<div key=${i} class="flex items-start gap-3 border-l border-slate-800 pb-2.5 pl-4">
        <span class=${`absolute -ml-[21px] mt-1.5 h-1.5 w-1.5 rounded-full ${
          live?'animate-pulse bg-sky-400':'bg-slate-600'}`}></span>

        <div><div class=${`text-[11.5px] ${live?'text-slate-200':'text-slate-400'}`}>
          ${TOOL_SAYS[s.tool] || pretty(s.tool)}</div>

            s.arguments?.metric?` · ${pretty(s.arguments.metric)}`:''}</div></div>

  </div>`;
}

        <h3 class="mb-1.5 text-[12px] font-semibold uppercase tracking-wider text-slate-300">
          What could change this reading</h3>
        <p class="text-[12.5px] leading-relaxed text-slate-400">${m.residual}</p></section>`}

      ${m.limitations.length>0 && html`<section class="mb-5">
        <h3 class="mb-2 text-[12px] font-semibold uppercase tracking-wider text-slate-300">
          What we could not see</h3>
        <div class="hatch space-y-1.5 rounded border border-slate-700 p-3">
          ${m.limitations.map((l,i)=>html`<p key=${i} class="text-[11.5px] leading-relaxed text-slate-400">${l}</p>`)}
        </div>
        <p class="mt-1.5 text-[10.5px] text-slate-600">
          We list the gaps rather than quietly working around them. Drawing conclusions from
          incomplete data without saying so is the exact failure this system exists to avoid.</p></section>`}
    </div>

    <div class="flex shrink-0 flex-wrap items-center gap-2 border-t border-slate-800 bg-slate-950 px-6 py-3">
      <button onClick=${()=>onAction('export')}
        class="flex items-center gap-1.5 rounded bg-sky-700 px-3 py-1.5 text-[11.5px] font-semibold
               text-white hover:bg-sky-600">
        <${Icon} name="download" cls="w-3.5 h-3.5"/>Save this report</button>
      <button onClick=${()=>onAction('flag')}
        class="flex items-center gap-1.5 rounded border border-slate-700 px-3 py-1.5 text-[11.5px]
               text-slate-300 hover:border-slate-500">
        <${Icon} name="flag" cls="w-3.5 h-3.5"/>Flag for a human to review</button>
      <button onClick=${()=>onAction('rerun')}
        class="flex items-center gap-1.5 rounded border border-slate-700 px-3 py-1.5 text-[11.5px]
               text-slate-300 hover:border-slate-500">
        <${Icon} name="refresh-cw" cls="w-3.5 h-3.5"/>Run it again</button>
      <span class="ml-auto text-[10px] text-slate-600">
        Information only — this describes risk, it never tells you what to do.</span>
    </div>
  </div>`;
}

function Provenance({ data, loading, activeEvidence }) {
  const [tab, setTab] = useState('trail');
  const [exhibit, setExhibit] = useState(null);
  const trail = (!loading && data?.memo?.audit_trail) || [];

  useEffect(() => { setExhibit(null); }, [data?.cik, data?.as_of]);
  useEffect(() => {
    if (tab==='exhibit' && data?.cik && !exhibit && !loading)
      api(`/api/trend?cik=${data.cik}&as_of=${data.as_of}&metric=current_ratio`).then(setExhibit);
  }, [tab, data, exhibit, loading]);

  const related = activeEvidence
    ? trail.map((c,i)=>({c,i})).filter(({c}) => {
        const hay = ((c.summary||'') + JSON.stringify(c.arguments||{})).toLowerCase();
        return hay.includes(String(activeEvidence.metric).toLowerCase());
      })
    : [];
  const relatedIdx = new Set(related.map(r=>r.i));
  const evidence = (!loading && data?.memo?.sections.flatMap(s=>s.evidence)) || [];

  return html`<aside class="flex h-full w-[366px] shrink-0 flex-col border-l border-slate-800 bg-slate-950">
    <div class="border-b border-slate-800 px-3.5 py-2">
      <div class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Where it came from</div>
      <p class="mt-0.5 text-[10px] leading-snug text-slate-600">
        Every step the system took, and the original figures behind each claim.</p>
    </div>
    <div class="flex shrink-0 border-b border-slate-800">
      ${[['trail','Steps taken'],['verify','Number check'],['exhibit','Original data']].map(([k,l])=>
        html`<button key=${k} onClick=${()=>setTab(k)}
          class=${`flex-1 px-3 py-2.5 text-[10.5px] font-semibold uppercase tracking-wider ${
            tab===k?'border-b-2 border-sky-600 text-slate-100':'text-slate-500 hover:text-slate-300'}`}>
          ${l}</button>`)}
    </div>

    ${loading && html`<p class="px-4 py-4 text-[11.5px] text-slate-600">Working…</p>`}
    ${!loading && !data?.memo && html`<p class="px-4 py-4 text-[11.5px] leading-relaxed text-slate-600">
      This fills in once a report is produced. Click any figure in the report and the step
      that produced it lights up here.</p>`}

    ${!loading && data?.memo && tab==='trail' && html`<div class="min-h-0 flex-1 overflow-y-auto p-3">
      ${activeEvidence && html`<div class="mb-2.5 rounded border border-sky-800 bg-sky-950/30 px-2.5 py-1.5">
        <div class="font-mono text-[10px] uppercase tracking-wider text-sky-400">Tracing</div>
        <div class="mt-0.5 font-mono text-[11.5px] text-slate-200">
          ${pretty(activeEvidence.metric)} = <span class="tnum">${num(activeEvidence.value)}</span>
          ${activeEvidence.period_end && html`<span class="text-slate-500"> @ ${activeEvidence.period_end}</span>`}</div>
        ${gl(activeEvidence.metric) && html`<p class="mt-1 text-[10.5px] leading-relaxed text-slate-400">
          ${gl(activeEvidence.metric)}</p>`}
        <div class="mt-1 text-[10px] text-slate-500">
          ${related.length} matching step${related.length===1?'':'s'} highlighted below</div>
      </div>`}
      ${trail.length===0 && html`<p class="text-[11.5px] text-slate-600">No steps recorded.</p>`}
      ${trail.map((c,i)=>html`<div key=${i} class=${`mb-1.5 rounded border px-2.5 py-2 ${
          relatedIdx.has(i)?'border-sky-700 bg-sky-950/25':'border-slate-800'}`}>
        <div class="flex items-center gap-2">
          <span class="font-mono text-[10px] text-slate-600 tnum">${String(i+1).padStart(2,'0')}</span>
          <span class="font-mono text-[11px] text-slate-200">${pretty(c.tool)}</span>
          ${c.ok===false && html`<span class="ml-auto font-mono text-[9.5px] text-red-400">FAILED</span>`}
        </div>
        <div class="mt-1 pl-6 font-mono text-[10.5px] leading-relaxed text-slate-500">

        Each step was chosen after reading the previous result. It is not a fixed checklist —
        the system decides where to look next, which is what makes it an investigation.</p>
    </div>`}

    ${!loading && data?.memo && tab==='verify' && html`<div class="min-h-0 flex-1 overflow-y-auto p-3">
      <div class="mb-3 rounded border border-emerald-900/60 px-3 py-2.5">
        <div class="flex items-center gap-2 font-mono text-[10.5px] tracking-wider text-emerald-400">
          <${Icon} name="check-check" cls="w-3.5 h-3.5"/>EVERY NUMBER REPRODUCED</div>
        <p class="mt-1.5 text-[11px] leading-relaxed text-slate-400">

        <tr class="border-b border-slate-800"><${Th}>Figure quoted<//><${Th} r>Value<//>

          <td class="py-1.5 text-right font-mono text-[10px] text-emerald-400">MATCH</td></tr>`)}
      </table>
      <p class="mt-2.5 text-[10px] leading-relaxed text-slate-600">

    ${!loading && data?.memo && tab==='exhibit' && html`<div class="min-h-0 flex-1 overflow-y-auto p-3">
      <div class="mb-1 font-mono text-[10px] uppercase tracking-wider text-slate-500">
        Current ratio over time — oldest first</div>
      <p class="mb-2 text-[10.5px] leading-relaxed text-slate-500">${GLOSS.current_ratio}</p>
      ${!exhibit && html`<p class="text-[11.5px] text-slate-600">Loading…</p>`}
      ${exhibit?.points && html`<div><${Spark} points=${exhibit.points} w=${330}/>
        <table class="mt-2 w-full text-[11px]">
          <tr class="border-b border-slate-800"><${Th}>Period ending<//><${Th} r>Value<//></tr>
          ${exhibit.points.map((p,i)=>html`<tr key=${i} class="border-b border-slate-900">
            <td class="py-1.5 font-mono text-slate-400 tnum">${p.period_end}</td>
            <td class="py-1.5 text-right font-mono text-slate-200 tnum">
              ${p.value==null?html`<${Absent} what="not reported"/>`:p.value.toFixed(4)}</td></tr>`)}
        </table></div>`}
      <p class="mt-2.5 text-[10px] leading-relaxed text-slate-600">
        Straight from the company's own SEC filings, limited to what was public on or before
        ${data.as_of}. A blank period means the company did not report the ingredients — which
        is itself worth knowing.</p>
    </div>`}
  </aside>`;
}

  const [d, setD] = useState(null);
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    if (!target) { setD(null); return; }
    setBusy(true); setD(null);
    const qs = target.cik ? `cik=${target.cik}` : `query=${encodeURIComponent(target.name)}`;
    api(`/api/diagnostic?${qs}&as_of=${asOf}`).then(r=>{setD(r);setBusy(false);});
  }, [target, asOf]);

  if (!target) return html`<div class="flex h-full items-center justify-center px-10 text-center">
    <p class="text-[13px] text-slate-400">Pick a company to check.</p></div>`;
  if (busy) return html`<div class="flex h-full items-center justify-center text-[12px] text-slate-500">
    Working out how each year looked at the time…</div>`;
  if (!d) return null;
  if (d.error) return html`<div class="mx-auto max-w-4xl px-7 py-6">
    <${Card} title="No health check available"><p class="text-[12px] text-red-400">${d.error}</p>
      ${(d.candidates||[]).length>0 && html`<table class="mt-3 w-full text-[12px]">
        ${d.candidates.map(c=>html`<tr key=${c.cik} onClick=${()=>onPick(c)}
          class="cursor-pointer border-b border-slate-900 hover:bg-slate-900">
          <td class="py-1.5 text-slate-300">${c.name}</td>
          <td class="py-1.5 font-mono text-slate-500">${c.ticker}</td>
          <td class="py-1.5 text-right font-mono text-slate-500 tnum">${c.cik}</td></tr>`)}
      </table>`}<//></div>`;

  const breached = d.calculated.filter(c=>c.breached).length;
  const computable = d.calculated.filter(c=>c.computable).length;
  const zoneNote = (d.zones||[]).find(z=>z.key===d.zone)?.note || '';
  const active = ZONE_ORDER.indexOf(d.zone);

  return html`<div class="mx-auto max-w-5xl px-7 py-6">
    <div class="mb-4 flex flex-wrap items-start justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <div class="text-[17px] font-semibold tracking-tight text-slate-100">${d.name || 'CIK '+d.cik}</div>
        <div class="mt-1 flex flex-wrap gap-3 font-mono text-[10.5px] text-slate-500">
          <span title="The company's permanent ID number at the SEC.">CIK ${String(d.cik).padStart(10,'0')}</span>
          ${d.ticker && html`<span>${d.ticker}</span>`}
          ${d.exchange && html`<span>${d.exchange}</span>`}
          ${d.state && html`<span>registered in ${d.state}</span>`}
        </div>
        <div class="mt-1 text-[10.5px] text-slate-600" title="The industry code the company files under.">
          Industry ${d.sic} — ${d.sic_description}</div>
      </div>
      <div class="text-right"><div class="text-[9.5px] uppercase tracking-wider text-slate-500">Looking as of</div>
        <div class="font-mono text-[13px] text-slate-200 tnum">${d.as_of}</div></div>
    </div>

    <${Card} title=${`Condition in the accounts ending ${d.period_end || d.as_of}`}>
      <div class="mb-3 grid grid-cols-4 gap-1.5">
        ${ZONE_ORDER.map((z,i)=>{
          const on = i===active;
          const lbl = (d.zones||[]).find(x=>x.key===z)?.label || z;
          return html`<div key=${z}>
            <div class="h-1.5 rounded-sm" style=${{background: on?ZONE_HEX[z]:'#1e293b'}}></div>
            <div class=${`mt-1.5 font-mono text-[9.5px] uppercase tracking-wide ${
              on?ZONE_TONE[z]:'text-slate-600'}`}>${lbl}</div></div>`;
        })}
      </div>
      <div class="flex flex-wrap items-baseline gap-3">
        <span class=${`border-l-2 pl-2 font-mono text-[12px] font-bold uppercase tracking-wider
          ${ZONE_TONE[d.zone]||'text-slate-400'}`} style=${{borderColor:ZONE_HEX[d.zone]}}>${d.zone_label}</span>
        <span class="text-[11.5px] text-slate-400">
          <b class="font-mono text-slate-200 tnum">${breached}</b> of
          <b class="font-mono text-slate-200 tnum">${computable}</b> standard warning levels crossed,
          in the figures the company filed for the period ending ${d.period_end || '—'}.</span>
      </div>
      <p class="mt-2.5 text-[11px] leading-relaxed text-slate-500">${zoneNote} This describes filings
        already made, as they stood on ${d.as_of}. It is not a forecast.</p>
      ${d.stale && html`<div class="hatch mt-2.5 rounded border border-amber-900/60 px-3 py-2">
        <p class="text-[11px] leading-relaxed text-amber-300/90">Careful: the newest usable filing is
          <b class="font-mono tnum">${d.filing_age_days}</b> days old. Everything on this screen
          describes that older snapshot, and things may have moved either way since.</p></div>`}
    <//>

    <div class="grid gap-4 lg:grid-cols-2">
      <${Card} title="What the company reported" right=${html`<${Badge} status="STRAIGHT FROM THE FILING" tone="sky"/>`}

          ${d.period_end||'—'}, so you can look each one up in the document. A hatched box means
          the company did not report that item in a machine-readable way — which is itself a finding.`}>
        <table class="w-full text-[12px]">
          <tr class="border-b border-slate-800"><${Th}>Item<//><${Th} r>Amount (USD)<//></tr>

            <td class="py-1.5 text-right font-mono text-slate-100 tnum">
              ${r.computable?money(r.value):html`<${Absent} what="not reported"/>`}</td></tr>`)}
        </table>
      <//>
      <${Card} title="What that adds up to" right=${html`<${Badge} status="OUR ARITHMETIC" tone="slate"/>`}
        note=${`Sums we do on the figures at left, compared against warning levels that are
          standard in credit work — not levels we tuned to fit past bankruptcies. Tuning them
          would turn this into a model of history rather than a reading of the accounts.
          Hover any name for what it means.`}>
        <table class="w-full text-[12px]">
          <tr class="border-b border-slate-800"><${Th}>Measure<//><${Th} r>Value<//>
            <${Th} r>Warning level<//><${Th} r>Status<//></tr>
          ${d.calculated.map((c,i)=>html`<tr key=${i} class="border-b border-slate-900">
            <td class="py-1.5 text-slate-300"><${Term} k=${c.key||c.label}>${c.label}<//></td>
            <td class=${`py-1.5 text-right font-mono tnum ${c.breached?'text-red-400':'text-slate-100'}`}>
              ${c.computable?num(c.value):html`<${Absent} what="n/a"/>`}</td>
            <td class="py-1.5 text-right font-mono text-[10.5px] text-slate-600 tnum">${c.threshold}</td>
            <td class="py-1.5 text-right font-mono text-[9.5px] uppercase tracking-wide">
              ${c.breached?html`<span class="text-red-400">crossed</span>`
                :c.computable?html`<span class="text-slate-600">ok</span>`:''}</td></tr>`)}
        </table>
      <//>
    </div>

    ${(d.timeline||[]).length>0 && html`<${Card} title="How this looked in earlier years"
      note="Each year was worked out using only what had been filed by then — we did not apply
        today's view to old numbers. That is what makes this a record rather than a rewrite.">
      <div class="relative">
      ${[...d.timeline, {as_of:d.period_end||d.as_of, zone:d.zone, breached, computable, now:true}]
        .map((t,i)=>html`<div key=${i} class="relative flex items-start gap-3 border-l border-slate-800 pb-3 pl-4">
          <span class="absolute -left-[4.5px] top-1.5 h-2 w-2 rounded-full"
            style=${{background:ZONE_HEX[t.zone]}}></span>
          <div class="w-[86px] shrink-0 font-mono text-[11px] text-slate-500 tnum">${t.as_of}</div>
          <div><div class=${`font-mono text-[11.5px] ${ZONE_TONE[t.zone]}`}>
            ${(d.zones||[]).find(z=>z.key===t.zone)?.label || t.zone}</div>
            <div class="text-[10.5px] text-slate-600">${t.breached} of ${t.computable} warning levels crossed
              ${t.now?`— the most recent accounts visible on ${d.as_of}`:'in what had been filed by then'}</div>
          </div></div>`)}
      </div>
    <//>`}

    <div class="hatch rounded border border-slate-700 px-4 py-3">
      <p class="text-[11px] leading-relaxed text-slate-400">This is an analysis of financial filings
        that have already been made. It does not predict future performance, judge whether a company
        will survive, or tell you what to do about it.</p></div>
  </div>`;
}

        title="Uses the fast if-then version rather than the full investigation, because this runs one pass per company."/>`}

  const Quote = ({ text, page, label }) => html`<div class="mt-3">
    <div class="mb-1 flex items-center justify-between">
      <span class="text-[9.5px] uppercase tracking-wider text-slate-500">${label}</span>
      ${page && html`<span class="font-mono text-[10px] text-slate-500">page${String(page).includes("2013")?"s":""} ${page}</span>`}
    </div>
    <pre class="overflow-x-auto whitespace-pre-wrap rounded border border-slate-800 bg-slate-950 p-2.5
      font-mono text-[11px] leading-relaxed text-slate-300">${text}</pre></div>`;

  return html`<div class="mx-auto max-w-4xl px-7 py-6">
    <${Card} title="Scan a filing you already have"
      right=${html`<${Badge} status="NO AI INVOLVED" tone="emerald"/>`}
      note="This is plain phrase-matching over the text — the same code the investigation uses.
        No language model touches it, so it gives the same answer every single time.">
      <p class="mb-3 text-[11.5px] leading-relaxed text-slate-400">
        Drop in an annual or quarterly report — <b class="text-slate-300">PDF</b>, HTML or plain
        text — and we will look for two specific warnings that companies are required to disclose:
        a <span class="term" title=${GLOSS.going_concern}>going-concern warning</span> from the
        auditor, and an admission that the company's own financial controls are not working.
        For PDFs we also tell you which page each passage is on.</p>
      <div onDragOver=${e=>{e.preventDefault();setDrag(true);}} onDragLeave=${()=>setDrag(false)}
        onDrop=${e=>{e.preventDefault();setDrag(false);send(e.dataTransfer.files[0]);}}
        onClick=${()=>inp.current?.click()}
        class=${`cursor-pointer rounded border border-dashed px-6 py-9 text-center text-[12px] ${
          drag?'border-sky-600 bg-sky-950/20 text-sky-300':'border-slate-700 text-slate-500 hover:border-slate-500'}`}>
        <${Icon} name="upload" cls="w-5 h-5 mx-auto mb-2 opacity-60"/>
        ${busy?`Reading ${name}…`:'Drop a filing here, or click to choose one'}
        <div class="mt-1.5 font-mono text-[10px] text-slate-600">PDF · HTML · TXT</div>
      </div>
      <input ref=${inp} type="file" accept=".pdf,.htm,.html,.txt" class="hidden"
        onChange=${e=>send(e.target.files[0])}/>
    <//>

    ${d?.error && d.text_layer===false && html`<${Card} title="This PDF cannot be scanned honestly">
      <div class="hatch rounded border border-amber-900/60 px-3.5 py-3">
        <div class="mb-1.5 flex items-center gap-2 font-mono text-[10px] tracking-wider text-amber-400">
          <${Icon} name="scan-line" cls="w-3.5 h-3.5"/>NO TEXT LAYER — ${d.pages} PAGE(S) OF IMAGES</div>
        <p class="text-[12px] leading-relaxed text-slate-300">${d.error}</p>
      </div>
      <p class="mt-2.5 text-[10.5px] leading-relaxed text-slate-600">
        We refuse rather than return a result. A picture of a page has no searchable words in it,
        so every check would come back "not found" — including on a document whose first page says
        the auditors doubt the company can survive. A wrong all-clear is worse than no answer.</p>
    <//>`}
    ${d?.error && d.text_layer!==false && html`<${Card}><p class="text-[12px] text-red-400">${d.error}</p><//>`}

    ${d && !d.error && html`<${Card}
      title=${`${d.filename} — ${d.characters.toLocaleString()} characters read`}
      right=${d.format==='pdf'
        ? html`<${Badge} status=${`PDF · ${d.pages} PAGES`} tone="sky"/>`
        : html`<${Badge} status="HTML / TEXT" tone="slate"/>`}
      note=${`${d.note}. For context: a going-concern warning appeared in 54% of the companies that
        went bankrupt, against 2% of those that did not. Strong evidence — but not a verdict.`}>
      ${d.form_carries_financials===false && html`<div class="mb-3 rounded border-l-2 border-amber-500 bg-slate-900/60 px-3.5 py-2.5">
        <div class="mb-1 flex items-center gap-2 font-mono text-[10px] tracking-wider text-amber-400">
          <${Icon} name="info" cls="w-3.5 h-3.5"/>THIS FORM CANNOT CONTAIN THESE WARNINGS</div>
        <p class="text-[12px] leading-relaxed text-slate-300">
          This is a <b class="text-slate-100">Form ${d.form_code}</b> — ${d.form_name}.
          ${d.form_note}</p>
        <p class="mt-1.5 text-[11px] leading-relaxed text-slate-400">
          So "not found" below describes the document, not the company. For these warnings
          you need its annual report (10-K) or quarterly report (10-Q).</p>
      </div>`}
      ${d.form_carries_financials===true && html`<div class="mb-3 text-[11px] text-slate-500">
        Identified as a <b class="text-slate-300">Form ${d.form_code}</b> — ${d.form_name}.
        This form does carry an auditor's opinion, so a "not found" below is a real finding.</div>`}
      ${d.form_code==='' && html`<div class="mb-3 text-[11px] text-slate-500">
        Could not identify the form from its cover page — possibly an excerpt. Scanned anyway;
        a "not found" here is weaker evidence than one from a full annual report.</div>`}
      ${d.image_pages?.length>0 && html`<div class="hatch mb-3 rounded border border-slate-700 px-3 py-2">
        <p class="text-[11px] leading-relaxed text-slate-400">
          <b class="text-slate-300">${d.image_pages.length} of ${d.pages} pages</b> held no readable
          text — page${d.image_pages.length===1?'':'s'} ${d.image_pages.join(', ')}. Those are
          images to us, so anything written only there was not searched.</p></div>`}
      <table class="w-full text-[12px]">
        <tr class="border-b border-slate-800"><${Th}>Warning<//><${Th} r>Result<//></tr>
        <tr class="border-b border-slate-900">
          <td class="py-1.5 text-slate-300"><span class="term" title=${GLOSS.going_concern}>
            Auditor doubts the company can survive the year</span></td>
          <td class="py-1.5 text-right"><${YN} on=${d.going_concern_doubt} page=${d.going_concern_page}/></td></tr>
        <tr class="border-b border-slate-900">
          <td class="py-1.5 text-slate-300" title="The company admits its own internal accounting checks are not working properly.">
            <span class="term">Serious weakness in internal financial controls</span></td>
          <td class="py-1.5 text-right"><${YN} on=${d.material_weakness} page=${d.material_weakness_page}/></td></tr>
      </table>
      ${d.injection_attempt && html`<div class="mt-3 rounded border border-amber-900/60 px-3 py-2">
        <div class="mb-1 flex items-center gap-1.5 font-mono text-[10px] tracking-wider text-amber-400">
          <${Icon} name="shield-alert" cls="w-3.5 h-3.5"/>SUSPICIOUS TEXT NEUTRALISED</div>
        <p class="text-[11px] leading-relaxed text-slate-400">${d.injection_note}</p></div>`}
      ${d.going_concern_quote && html`<${Quote} text=${d.going_concern_quote}
        page=${d.going_concern_page} label="The exact wording"/>`}
      ${d.material_weakness_quote && html`<${Quote} text=${d.material_weakness_quote}
        page=${d.material_weakness_page} label="The exact wording"/>`}
    <//>`}
  </div>`;
}

/* ------------------------------------------------------------------ ASK ---- */
/* Questions people actually ask, grouped by the evidence each needs.
   Shown rather than left to guesswork: the single biggest cause of a blocked
   answer was a reader asking a company question in general mode, or the
   reverse, with nothing on screen to say the two were different. */
const SUGGESTED = {
  company: [
    'Why is this company at risk?',
    'If it looks healthy now, was it ever in trouble?',
    'When exactly did it file for bankruptcy?',
    'What is the quick ratio?',
    'How has the current ratio moved over the years?',
    'Show me the trend as a chart.',
    'What did the auditor say?',
    'What could you not see in these filings?',
    'Give me the main risks as points.',
    'Explain it in detail, 400 words.',
    'What would change your reading?',
    'Should I buy the stock?',
  ],
  compare: [
    'Which of these is under the most strain?',
    'Rank them by leverage.',
    'How does this one compare with the others?',
    'Which has the thinnest cash cushion?',
  ],
  general: [
    'What is a going-concern warning?',
    'What does the current ratio measure?',
    'What is Chapter 11?',
    'What is a covenant breach?',
    'Why do companies stop reporting line items?',
    'What is the difference between liquidity and solvency?',
  ],
};

const MODES = [
  ['company', 'This company', 'Answers only from the loaded assessment. Every figure cited and checked.'],
  ['compare', 'Compare',      'Several filers, each assessed from its own filings before being discussed.'],
  ['general', 'General',      'Concepts and definitions. Makes no claim about any company.'],
];
const GROUND_RULES = [
  ['quote','Only figures already checked','Answers may repeat numbers from the report, which were each recalculated from the original filing. A number that is not in the report cannot appear in an answer.'],
  ['shield','Nothing invented','Before an answer is shown, every number in it is matched back against the verified set. If even one has no source, the whole answer is withheld and you are told which figure failed.'],
  ['ban','No advice, ever','Ask what to buy, sell, lend or price and the system will lay out the evidence and then decline. Recommending is a regulated activity, and this system has no basis for it.'],
];
function Ask({ data, setView, portfolio, log, setLog }) {
  const [q, setQ] = useState('');
  const [busy, setBusy] = useState(false);
  const [mode, setMode] = useState('company');
  const [openRules, setOpenRules] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [copied, setCopied] = useState(-1);
  const box = useRef(null);

  /* A visible clock while the model works. A ninety-second wait with a
     disabled button looks identical to a hung request; a counter that moves
     is the difference between "working" and "broken". */
  useEffect(() => {
    if (!busy) { setElapsed(0); return; }
    const t0 = Date.now();
    const id = setInterval(() => setElapsed((Date.now() - t0) / 1000), 100);
    return () => clearInterval(id);
  }, [busy]);

  const send = async (text) => {
    const question = (text ?? q).trim();
    if (!question || busy) return;
    if (mode === 'company' && !data?.memo) {
      setLog(l => [{ question, mode, error: 'Open a report first — answers in this mode may only quote a report that has already been checked.' }, ...l]);
      return;
    }
    setBusy(true); setQ('');
    const t0 = Date.now();
    const scope = mode === 'company' && data?.memo
      ? log.filter(e => e.mode === 'company' && e.cik === data.cik && e.as_of === data.as_of
                        && e.allowed && e.answer)
           .slice(0, 3).reverse()
           .map(e => ({ question: e.question, answer: e.answer, allowed: true,
                        cik: e.cik, as_of: e.as_of }))
      : [];
    const d = await post('/api/ask', {
      assessment: mode === 'general' ? {} : (data || {}),
      question, mode, ciks: portfolio || [], history: scope,
    });
    let chart = null;
    if (d.chart) {
      const t = await api(`/api/trend?cik=${d.chart.cik}&as_of=${d.chart.as_of}&metric=${d.chart.metric}`);
      if (!t.error) chart = { ...t, metric: d.chart.metric };
    }
    setLog(l => [{ question, mode, cik: data?.cik, as_of: data?.as_of,
                   secs: (Date.now() - t0) / 1000, ...d, chart }, ...l]);
    setBusy(false);
    box.current?.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const MODES = [
    ['company', 'This company', data?.memo
      ? html`Only the loaded assessment. Every figure cited and checked. Currently
             <b class="text-slate-300">${data.company || 'CIK ' + data.cik}</b> as at
             <span class="font-mono tnum">${data.as_of}</span>.`
      : 'Only the loaded assessment — open a report first.'],
    ['compare', 'Compare', 'Several filers. Name one in the question or stage it here; each is assessed from its own filings before anything is said about it.'],
    ['general', 'General', 'Concepts and definitions. Makes no claim about any company.'],
  ];
  const active = MODES.find(m => m[0] === mode);

  const SUGGEST = {
    company: ['Why is this company at risk?', 'What is the quick ratio?',
              'Explain it in detail.', 'Give me the main risks as points.',
              'How has the current ratio moved?', 'Show the key measures in a table.'],
    compare: ['Compare this with Valaris.', 'Which of these is under most strain?',
              'Rank them by leverage.'],
    general: ['What is a going-concern warning?', 'What does the current ratio measure?',
              'What is the difference between liquidity and solvency?'],
  }[mode];

  return html`<div class="mx-auto flex h-full max-w-4xl flex-col px-7 pt-5">

    <div class="mb-3 flex flex-wrap items-center gap-2">
      <div class="flex rounded-md border border-slate-800 p-0.5">
        ${MODES.map(([k, label]) => html`<button key=${k} onClick=${() => setMode(k)}
          class=${`rounded px-3 py-1.5 text-[11.5px] transition-colors ${
            mode === k ? 'bg-slate-800 text-slate-100' : 'text-slate-500 hover:text-slate-300'}`}>
          ${label}</button>`)}
      </div>
      ${log.length > 0 && html`<span class="font-mono text-[10px] text-slate-600">
        ${log.length} turn${log.length === 1 ? '' : 's'}</span>`}
      ${log.length > 0 && html`<button
        onClick=${() => { if (confirm('Delete the whole conversation? This cannot be undone.')) setLog([]); }}
        class="font-mono text-[10px] text-slate-600 underline decoration-slate-800 hover:text-red-400">
        clear</button>`}
      <button onClick=${() => setOpenRules(o => !o)}
        class="ml-auto flex items-center gap-1.5 font-mono text-[10px] text-slate-500 hover:text-slate-300">
        <${Icon} name="shield-check" cls="w-3 h-3 text-emerald-500"/>
        how answers are kept honest
        <${Icon} name=${openRules ? 'chevron-up' : 'chevron-down'} cls="w-3 h-3"/></button>
    </div>

    <p class="mb-3 text-[11px] leading-relaxed text-slate-500">${active[2]}</p>

    ${openRules && html`<div class="mb-3 grid gap-3 rounded border border-slate-800 bg-slate-900/40 px-4 py-3 md:grid-cols-3">
      ${GROUND_RULES.map(([ic, t, p2]) => html`<div key=${t}>
        <div class="flex items-center gap-1.5 text-[11.5px] font-semibold text-slate-200">
          <${Icon} name=${ic} cls="w-3.5 h-3.5 text-slate-500"/>${t}</div>
        <p class="mt-1 text-[10.5px] leading-relaxed text-slate-500">${p2}</p></div>`)}
    </div>`}

    <div ref=${box} class="min-h-0 flex-1 overflow-y-auto pb-2">
      ${log.length === 0 && !busy && html`<div class="mt-10 text-center">
        <${Icon} name="message-square" cls="w-6 h-6 mx-auto text-slate-700"/>
        <p class="mt-2 text-[12.5px] text-slate-400">Ask in plain English.</p>
        <p class="mt-1 text-[11px] text-slate-600">
          The answer takes the shape of the question — a figure gets a sentence,
          "why" gets a paragraph, "in detail" gets sections.</p>
      </div>`}

      ${busy && html`<div class="mb-3 rounded border border-slate-800 bg-slate-900/30 px-4 py-3">
        <div class="flex items-center gap-2 text-[11.5px] text-slate-400">
          <span class="flex gap-1">
            ${[0, 1, 2].map(i => html`<span key=${i}
              class="h-1.5 w-1.5 animate-pulse rounded-full bg-sky-500"
              style=${{ animationDelay: `${i * 0.15}s` }}></span>`)}
          </span>
          Reading the assessment
          <span class="ml-auto font-mono text-[10px] text-slate-600 tnum">${elapsed.toFixed(1)}s</span>
        </div>
      </div>`}

      ${log.map((e, i) => html`<div key=${i} class="mb-4">
        <div class="mb-1.5 flex items-start gap-2">
          <${Icon} name="corner-down-right" cls="w-3.5 h-3.5 mt-0.5 shrink-0 text-slate-600"/>
          <span class="text-[13px] font-medium leading-snug text-slate-100">${e.question}</span>
        </div>

        <div class=${`rounded-lg border px-4 py-3 ${
          e.error ? 'border-red-900/60 bg-red-950/10'
          : e.allowed === false ? 'border-amber-900/50 bg-amber-950/10'
          : 'border-slate-800 bg-slate-900/40'}`}>
          ${e.error && html`<p class="text-[12.5px] text-red-400">${e.error}</p>`}

          ${e.allowed === false && html`<div>
            <div class="mb-1.5 flex items-center gap-1.5 font-mono text-[10px] tracking-wider text-amber-400">
              <${Icon} name="shield" cls="w-3.5 h-3.5"/>WITHHELD BY THE GUARD</div>
            <p class="text-[12.5px] leading-relaxed text-slate-300">${e.reason}</p>
            ${e.ungrounded_numbers?.length > 0 && html`<p class="mt-1.5 font-mono text-[11px] text-slate-500">
              ${e.ungrounded_numbers.join(' · ')}</p>`}
          </div>`}

          ${e.allowed && html`<div>
            <${Rich} text=${e.answer}/>
            ${e.chart?.points && html`<div class="mt-3 rounded border border-slate-800 p-3">
              <div class="mb-1.5 font-mono text-[10px] uppercase tracking-wider text-slate-500">
                ${pretty(e.chart.metric)}</div>
              <${Spark} points=${e.chart.points} w=${560} h=${120}/></div>`}
            ${(e.caveats || []).map((c, j) => html`<p key=${j}
              class="mt-2 text-[10.5px] leading-relaxed text-slate-600">${c}</p>`)}
          </div>`}

          ${(e.allowed || e.allowed === false) && html`<div
            class="mt-2.5 flex flex-wrap items-center gap-x-3 gap-y-1 border-t border-slate-800/70 pt-2
                   font-mono text-[9.5px] text-slate-600">
            <span class="uppercase tracking-wider">${e.mode}</span>
            ${e.figures_verified > 0 && html`<span class="text-emerald-600">
              ${e.figures_verified} figure${e.figures_verified === 1 ? '' : 's'} traced</span>`}
            ${e.figures_untagged > 0 && html`<span>${e.figures_untagged} unbound</span>`}
            ${e.partial && html`<span class="text-amber-600">partial</span>`}
            ${e.repaired && html`<span class="text-sky-600">repaired</span>`}
            ${e.secs != null && html`<span class="tnum">${e.secs.toFixed(1)}s</span>`}
            <button onClick=${() => { navigator.clipboard?.writeText(e.answer || '');
                                      setCopied(i); setTimeout(() => setCopied(-1), 1500); }}
              class="ml-auto hover:text-slate-300">${copied === i ? 'copied' : 'copy'}</button>
            <button onClick=${() => send(e.question)} class="hover:text-slate-300">retry</button>
          </div>`}
        </div>
      </div>`)}
    </div>

    <div class="shrink-0 border-t border-slate-800 bg-slate-950 pb-4 pt-3">
      <div class="mb-2 flex flex-wrap gap-1.5">
        ${SUGGEST.map(sg => html`<button key=${sg} onClick=${() => send(sg)} disabled=${busy}
          class="rounded-full border border-slate-800 px-2.5 py-1 text-[10.5px] text-slate-500
                 transition-colors hover:border-slate-600 hover:text-slate-300 disabled:opacity-40">
          ${sg}</button>`)}
      </div>
      <div class="flex gap-2">
        <input value=${q} onInput=${e => setQ(e.target.value)}
          onKeyDown=${e => e.key === 'Enter' && send()} disabled=${busy}
          placeholder=${mode === 'general' ? 'Ask about a concept — no company needed…'
                        : mode === 'compare' ? 'Name the companies, or stage them first…'
                        : "Ask about this company's filings…"}
          class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3.5 py-2.5 text-[12.5px]
                 text-slate-100 outline-none transition-colors placeholder:text-slate-600
                 focus:border-sky-600 disabled:opacity-50"/>
        <button onClick=${() => send()} disabled=${busy || !q.trim()}
          class="flex shrink-0 items-center gap-1.5 rounded-lg bg-sky-700 px-4 text-[11.5px]
                 font-semibold text-white transition-colors hover:bg-sky-600
                 disabled:opacity-40">
          <${Icon} name="send" cls="w-3.5 h-3.5"/>${busy ? '…' : 'Ask'}</button>
      </div>
    </div>
  </div>`;
}

/* --------------------------------------------------------------- METHOD ---- */
const LIMITS = [
  ['It never tells you what to do.','It describes risk. It will not recommend lending, investing or pricing, and it refuses when asked.'],
  ['Treat the ranking, not the percentage.','Our test set deliberately contains far more distressed companies than the real world does. The ordering carries over; the absolute probabilities do not.'],
  ['The earnings-quality part is a demo.','Eight approaches all landed between 0.51 and 0.61 — barely better than a coin flip. Those observations are shown as background and never affect the verdict.'],
  ['Economy-wide data made it worse.','We tried adding interest rates and market stress indicators. It hurt: with only 19 test dates, those figures act as date labels rather than economics, so they are excluded.'],
  ['US public companies only,','and one model over one stretch of time.'],
  ['It has never once said "I don’t know".','Every non-answer in 200 test cases was a technical failure, not a judgement call. So "it will tell you when it is unsure" is a claim we cannot make.'],
];
function Method() {
  return html`<div class="mx-auto max-w-4xl px-7 py-6">
    <${Card} title="How we tested it"
      note=${html`200 company-dates, half of which really did go bankrupt. Nothing filed after each
        test date was visible, the test companies never appeared in training, and reading the words
        in filings was worth <b class="text-slate-400">+0.084</b>. Our system
        <b class="text-slate-400">draws</b> with the best pure statistics we could build — it does
        not beat it, and we are not going to claim otherwise.`}>
      <p class="mb-3 text-[11.5px] leading-relaxed text-slate-400">
        The score runs 0.5 to 1.0 and answers one question: pick a company that went bankrupt and one
        that did not — how often does the method rank them the right way round?
        <span class="term" title=${GLOSS.auc}>0.5 is a coin flip, 1.0 is perfect.</span>
        "Confidently wrong" is how often it called a doomed company healthy, or the reverse.</p>
      <table class="w-full text-[12px]">
        <tr class="border-b border-slate-800"><${Th}>Method<//><${Th} r>Score<//>
          <${Th} r>Confidently wrong<//><${Th} r>Standing<//></tr>
        ${[['Our system, reading numbers and words','0.963','8%','tested'],
           ['Our system, numbers only','0.881','25%','tested'],
           ['Best pure statistics we could build','0.977','—','comparison'],
           ['A standard bankruptcy hazard model','0.966','—','comparison'],
           ['A classic 1960s distress formula','0.880','—','comparison'],
           ['Simple if-then rules','0.885','—','floor']].map((r,i)=>html`
          <tr key=${i} class="border-b border-slate-900">
            <td class="py-1.5 text-slate-300">${r[0]}</td>
            <td class="py-1.5 text-right font-mono text-slate-100 tnum">${r[1]}</td>
            <td class="py-1.5 text-right font-mono text-slate-400 tnum">${r[2]}</td>
            <td class="py-1.5 text-right font-mono text-[10px] text-slate-500">${r[3]}</td></tr>`)}
      </table>
    <//>
    <${Card} title="Did it find the warning signs that were there?"
      note="We hand-listed every warning sign present in the filings, then checked how many the
        system actually surfaced. Nothing was missed because it failed to look — every miss was
        something it read and then decided not to raise.">
      <div class="flex flex-wrap gap-8">
        <div><div class="font-mono text-[21px] text-slate-100 tnum">84%</div>
          <div class="text-[11px] text-slate-400">warning signs surfaced</div>
          <div class="text-[10px] text-slate-600">183 out of 217</div></div>
        <div><div class="font-mono text-[21px] text-slate-100 tnum">0</div>
          <div class="text-[11px] text-slate-400">missed by not looking</div>
          <div class="text-[10px] text-slate-600">every miss was read, then judged unimportant</div></div>
        <div><div class="font-mono text-[21px] text-slate-100 tnum">0</div>
          <div class="text-[11px] text-slate-400">invented numbers</div>
          <div class="text-[10px] text-slate-600">across ~5,800 answers</div></div>
      </div>
    <//>
    <${Card} title="What it does not do">
      <ul class="space-y-2">
        ${LIMITS.map(([b,t],i)=>html`<li key=${i} class="flex gap-2.5 text-[12px] leading-relaxed">
          <span class="mt-[7px] h-1 w-1 shrink-0 rounded-full bg-slate-600"></span>
          <span><b class="text-slate-200">${b}</b> <span class="text-slate-400">${t}</span></span></li>`)}
      </ul>
    <//>
  </div>`;
}

/* ----------------------------------------------------------------- APP ---- */
function App() {
  const [view, setView] = useState('overview');
  const [asOf, setAsOf] = useState('2024-07-01');
  const [target, setTarget] = useState(null);
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [agent, setAgent] = useState('rules');
  const [cite, setCite] = useState(null);
  const [ev, setEv] = useState(null);
  const [toast, setToast] = useState('');
  const [portfolio, setPortfolio] = useState([]);
  // Lifted out of the Ask view. Conditional rendering unmounts that
  // component the moment a reader opens the memo, and the conversation --
  // including the separate thread kept for each company -- went with it.
  //
  // Persisted, because an analyst who reloads has not finished thinking. It
  // survives until they clear it, and only until then: nothing here expires
  // a thread on its own, because a system that silently forgets is worse
  // than one that never remembered.
  const [chatLog, setChatLog] = useState(loadChat);
  useEffect(() => { saveChat(chatLog); }, [chatLog]);
  const [steps, setSteps] = useState([]);
  const [elapsed, setElapsed] = useState(0);
  const seq = useRef(0);
  const es = useRef(null);

  const run = useCallback(async (t, a, d) => {
    if (!t) return;
    const mine = ++seq.current;
    es.current?.close();
    setLoading(true); setData(null); setCite(null); setEv(null); setSteps([]); setElapsed(0);
    const t0 = Date.now();
    const tick = setInterval(()=>setElapsed(Math.round((Date.now()-t0)/1000)), 1000);
    const stop = () => { clearInterval(tick); };

    // The quick pass returns in under a second, so streaming it would add a
    // connection for nothing. The full investigation is two minutes of
    // sequential model calls and needs to show its work.
    if (a !== 'react') {
      const body = t.cik ? { cik:t.cik } : { query:t.name };
      const r = await post('/api/assess', { ...body, as_of:d, agent:a });
      stop();
      if (mine !== seq.current) return;
      setData(r); setLoading(false);
      return;
    }

    const qs = new URLSearchParams({ as_of:d, agent:a });
    if (t.cik) qs.set('cik', t.cik); else qs.set('query', t.name);
    const src = new EventSource(`/api/assess/stream?${qs}`);
    es.current = src;
    src.addEventListener('step', e => {
      if (mine !== seq.current) return;
      setSteps(prev => [...prev, JSON.parse(e.data)]);
    });
    src.addEventListener('done', e => {
      src.close(); stop();
      if (mine !== seq.current) return;
      setData(JSON.parse(e.data)); setLoading(false);
    });
    src.onerror = () => {
      src.close(); stop();
      if (mine !== seq.current) return;
      setData({ error:'The connection to the server dropped mid-investigation.' });
      setLoading(false);
    };
  }, []);
  useEffect(() => { if (target) run(target, agent, asOf); }, [target, agent, asOf, run]);

  const pick = (t) => { setTarget(t); if (view==='overview'||view==='method') setView('memo'); };

  const onAction = (kind) => {
    if (kind==='rerun') { run(target, agent, asOf); return; }
    if (kind==='export' && data?.memo) {
      const blob = new Blob([data.memo.text], {type:'text/plain'});
      const u = URL.createObjectURL(blob);
      const a2 = document.createElement('a');
      a2.href=u; a2.download=`report_CIK${data.cik}_${data.as_of}.txt`; a2.click();
      URL.revokeObjectURL(u);
      setToast('Saved, with the full list of steps and sources.');
    }
    if (kind==='flag') setToast('Flagged for a human to review. The reading is unchanged — a person now owns it.');
    setTimeout(()=>setToast(''), 4500);
  };

  const title = (VIEWS.find(v=>v[0]===view)||[])[1];
  return html`<div class="flex h-full text-slate-100">
    <${Rail} asOf=${asOf} setAsOf=${setAsOf} onPick=${pick} active=${target}
      view=${view} setView=${setView}/>
    <main class="flex min-w-0 flex-1 flex-col">
      <div class="flex shrink-0 items-center justify-between gap-4 border-b border-slate-800 bg-slate-950 px-6 py-2">
        <div>
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-300">${title}</span>
          <span class="ml-2.5 text-[10.5px] text-slate-600">${VIEW_SUB[view]}</span>
        </div>
        <div class="flex items-center gap-3">
          ${(view==='memo'||view==='ask') && html`<select value=${agent} onInput=${e=>setAgent(e.target.value)}
            title="Quick pass uses fixed if-then rules. Full investigation lets the system decide what to check next — slower, and the one we tested at 0.963."
            class="rounded border border-slate-700 bg-slate-900 px-2 py-1 font-mono text-[11px] text-slate-300">
            <option value="rules">Quick pass · 0.885</option>
            <option value="react">Full investigation · 0.963</option>
          </select>`}
          <span class="font-mono text-[10px] text-slate-600">gemma-4-31b-it</span>
        </div>
      </div>
      <div class="min-h-0 flex-1 overflow-y-auto">
        ${view==='overview'   && html`<${Overview} setView=${setView}/>`}
        ${view==='memo'       && html`<${Memo} data=${data} loading=${loading} activeCite=${cite}
                                        steps=${steps} elapsed=${elapsed}
                                        onCite=${(id,e)=>{setCite(id);setEv(id?e:null);}} onAction=${onAction}/>`}
        ${view==='diagnostic' && html`<${Diagnostic} target=${target} asOf=${asOf} onPick=${pick}/>`}
        ${view==='portfolio'  && html`<${Portfolio} asOf=${asOf} onPick=${setTarget} setView=${setView} onStage=${setPortfolio}/>`}
        ${view==='document'   && html`<${DocumentScan}/>`}
        ${view==='ask'        && html`<${Ask} data=${data} setView=${setView} portfolio=${portfolio}
                                       log=${chatLog} setLog=${setChatLog}/>`}
        ${view==='method'     && html`<${Method}/>`}
      </div>
      <footer class="flex shrink-0 flex-wrap items-center gap-x-5 gap-y-1 border-t border-slate-800
        bg-slate-950 px-6 py-2 text-[10px] text-slate-600">
        <span>CreditPulse IQ — reading US company filings for signs of financial trouble.</span>
        <span>Information only. Nothing here is investment, lending or pricing advice.</span>
        <span class="ml-auto font-mono">viewing as of ${asOf}</span>
      </footer>
    </main>
    ${view==='memo' && html`<${Provenance} data=${data} loading=${loading} activeEvidence=${ev}/>`}
    ${toast && html`<div class="fixed bottom-14 left-1/2 -translate-x-1/2 rounded border border-slate-700
      bg-slate-900 px-4 py-2 text-[11.5px] text-slate-200 shadow-xl">${toast}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
